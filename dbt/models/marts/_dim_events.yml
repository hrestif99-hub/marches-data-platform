version: 2

models:
  - name: dim_events
    description: >-
      Dimension des événements géopolitiques et économiques : une ligne par événement du
      seed geopolitical_events, enrichie des actifs disponibles à cette date et du premier
      jour de bourse commun à ces actifs.

      Le début et la fin d'historique de chaque actif sont calculés depuis
      mart_prices_daily (première et dernière date_day où has_gold, has_brent, has_eurusd
      ou has_btc est vrai), jamais codés en dur : ils bougent si une source est rechargée
      ou complétée. La fin compte autant que le début : l'or vient d'un scraping unique et
      sa série s'arrête ; un événement postérieur à la fin d'une série ne l'exige plus. Le pétrole est
      représenté par le Brent, comme pour is_common_trading_day de mart_prices_daily.

      Calendriers différents : l'or (contrat _GC, marchés US), le Brent (calendrier de
      Londres, selon l'EIA) et l'EUR/USD (jours ouvrés TARGET de la BCE) n'ont pas les
      mêmes jours fériés, et le bitcoin cote 7j/7. Le premier jour de bourse commun est
      donc le premier jour ouvré de tous les calendriers concernés à la fois : il peut
      tomber plusieurs jours après l'événement (week-end suivi d'un férié propre à un
      seul marché), ou le jour même si tous les marchés étaient ouverts.
    columns:
      - name: event_id
        description: "Identifiant court et stable de l'événement, en snake_case, issu du seed. Clé de la dimension."
        data_tests:
          - unique
          - not_null
      - name: event_name
        description: "Libellé court de l'événement, en français (seed)."
      - name: event_date
        description: "Date de l'événement (seed, vérifiée à la source). Jour calendaire, peut tomber un week-end ou un jour férié."
        data_tests:
          - not_null
      - name: event_day_of_week
        description: "Jour de la semaine ISO de event_date : 1 = lundi ... 7 = dimanche (dayofweekiso, comme dim_date)."
      - name: event_day_name
        description: "Nom complet en anglais du jour de event_date (Monday ... Sunday), cohérent avec event_day_of_week."
      - name: category
        description: "Catégorie de l'événement (seed) : guerre, crise financière, élection, choc pétrolier ou crise sanitaire."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - guerre
                  - crise financière
                  - élection
                  - choc pétrolier
                  - crise sanitaire
      - name: description
        description: "Une phrase courte, factuelle et neutre, en français (seed)."
      - name: source_url
        description: "URL de la source qui atteste l'événement et sa date (seed)."
      - name: available_assets
        description: >-
          Actifs dont l'historique couvre la date de l'événement (début ET fin), c'est-à-dire
          tels que première cotation <= event_date <= dernière cotation dans
          mart_prices_daily (gold : has_gold, oil : has_brent, eurusd : has_eurusd, btc :
          has_btc). Un actif dont la série commence après l'événement, ou s'arrête avant,
          n'est pas listé. Ce n'est PAS la liste des actifs qui ont coté le jour même.
          Chaîne séparée par des virgules, sans espace, toujours dans l'ordre fixe
          gold,oil,eurusd,btc (sous-ensemble de cet ordre, ex. gold,oil,eurusd pour un
          événement antérieur au début de la série BTCUSDT).
          Chaîne plutôt qu'ARRAY : lisible telle quelle dans un outil de BI ou un export,
          comparable par égalité ; un ARRAY s'obtient au besoin par split(available_assets, ',').
      - name: first_trading_date
        description: >-
          Premier date_day >= event_date de mart_prices_daily où TOUS les actifs de
          available_assets ont coté ce jour-là (has_gold, has_brent, has_eurusd, has_btc
          selon le cas) ; les actifs absents de available_assets ne sont pas exigés.
          Égale à event_date si tous les marchés concernés étaient ouverts ce jour-là.
          Un actif dont la série s'arrête avant l'événement n'est pas exigé (voir
          available_assets). NULL (et test not_null en échec) si aucun jour commun n'existe
          entre event_date et la fin des séries exigées, par exemple pour un événement
          tombé sur la dernière cotation d'un actif un jour où un autre ne cote pas.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: days_to_first_trading_date
        description: "Écart en jours calendaires entre event_date et first_trading_date (0 si le premier jour commun est le jour même)."
